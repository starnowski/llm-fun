<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Stresu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kalkulator Stresu</h1>
        <div class="score-board">
            <h2>Suma punktów: <span id="total-score">0</span></h2>
        </div>
        <div id="db-status" style="margin-bottom: 15px; color: #f39c12; font-weight: bold;">
            Trwa ładowanie modelu AI i bazy danych...
        </div>
        
        <div class="input-section">
            <input type="text" id="situation-input" placeholder="Wpisz sytuację stresową..." autocomplete="off" disabled>
            <button id="add-btn" disabled>Dodaj</button>
        </div>

        <div class="history">
            <h3>Historia:</h3>
            <ul id="history-list"></ul>
        </div>

        <button id="reset-btn">Nowa Gra</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
